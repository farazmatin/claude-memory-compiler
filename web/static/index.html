<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Memory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>&#128220;</text></svg>">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Meeting Memory</h1>
  <nav>
    <button class="tab is-active" data-screen="ask">Ask</button>
    <button class="tab" data-screen="review">Review <span id="review-count" class="badge" hidden></span></button>
  </nav>
  <div id="health" class="health" title="LightRAG and manifest status">checking…</div>
</header>

<main id="screen-ask">
  <section id="thread" class="thread" aria-live="polite"></section>

  <form id="ask-form" class="ask">
    <textarea id="question" rows="2" placeholder="What did we decide about…?" required></textarea>
    <div class="controls">
      <label>Mode
        <select id="mode">
          <option value="">hybrid (default)</option>
          <option value="global">global — spans many meetings</option>
          <option value="local">local — one entity</option>
          <option value="naive">naive — plain vector</option>
        </select>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="local"> local synthesis
      </label>
      <button type="submit" id="submit">Ask</button>
    </div>
  </form>
</main>

<main id="screen-review" hidden>
  <div class="review-head">
    <p class="note">
      Everything upstream of this is inference. A wrong name becomes its own node
      in the graph and fragments retrieval across the whole corpus, so correcting
      one here is cheapest before it repeats.
    </p>
    <label class="checkbox">
      <input type="checkbox" id="show-reviewed"> show already reviewed
    </label>
  </div>
  <p id="review-status" class="banner" role="status" hidden></p>
  <div id="review-list" class="review-list" aria-live="polite"></div>
</main>

<dialog id="reader">
  <div class="reader-head">
    <h2 id="reader-title"></h2>
    <button id="reader-close" aria-label="Close">×</button>
  </div>
  <pre id="reader-body"></pre>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
