name: build and push cog

# Manual only. A push to Replicate creates a new version hash, and the pipeline
# pins vectors to that hash - so a build that fires on every commit would keep
# inventing namespaces nobody asked for.
on:
  workflow_dispatch:

# Pinned rather than tracking latest: a cog release changes how the image is
# built, and the pipeline pins its stored vectors to the version hash a build
# produces.
#
# v0.21.0, not v0.22.0. Under v0.22.0 the image itself built and exported
# cleanly every time, and then the "Adding labels to image" pass - a second,
# tiny build that bakes the predictor's OpenAPI schema in as a label - died with
# `no access allowed to dir "context"`. v0.22.0 reworked exactly that path
# (static schema generation, input validation against it), and nothing in this
# repo's Dockerfile or context is involved in that pass.
env:
  COG_VERSION: v0.21.0

jobs:
  push:
    # ubuntu-22.04, not ubuntu-latest. Six builds failed on ubuntu-latest at
    # cog's "Adding labels to image" pass with `no access allowed to dir
    # "context"`, across cog v0.21.0 and v0.22.0 and both buildx drivers. The
    # one thing common to all of them is the runner's BuildKit v0.20.2 (Docker
    # 28). 22.04 ships an older Docker, which makes this a single-variable test
    # of a cog/BuildKit protocol mismatch rather than another guess at our code.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The GPU image is large; reclaim runner space before building.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: fetch weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python scripts/fetch_weights.py

      # No setup-buildx-action here on purpose. It installs a `docker-container`
      # driver and makes it the default, which cog has a standing bug against
      # (replicate/cog#1026), and adding it changed nothing: the build failed
      # identically with and without it. The runner's stock builder is what cog
      # expects.
      - name: use the stock docker builder
        run: docker buildx use default && docker buildx inspect

      - name: install cog
        run: |
          sudo curl --fail --show-error --location -o /usr/local/bin/cog \
            https://github.com/replicate/cog/releases/download/${COG_VERSION}/cog_Linux_x86_64
          sudo chmod +x /usr/local/bin/cog
          cog --version

      - name: push
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: cog push r8.im/${{ vars.REPLICATE_MODEL }} --separate-weights=false

      - name: report the pinned version
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
            "https://api.replicate.com/v1/models/${{ vars.REPLICATE_MODEL }}" \
            | python -c "import json,sys; print('MMC_REMOTE_VOICE_VERSION=' + json.load(sys.stdin)['latest_version']['id'])"
