# LightRAG graph service + Postgres storage. All AI work is performed before
# publication by the Codex -> Claude -> Antigravity subscription chain.
#
# Every non-obvious setting works around a known issue or a measured constraint.
# Read the comments before changing anything.
#
#   cp .env.example .env      # fill in MMC_LIGHTRAG_API_KEY and POSTGRES_PASSWORD
#   docker compose up -d
#
# WebUI: http://localhost:9621  (loopback only - see the ports comments)

services:
  postgres:
    # pgvector, no Apache AGE. The graph runs on PGTableGraphStorage, which uses
    # plain PostgreSQL 14+ tables and needs no extensions, so the AGE-bundled
    # image is unnecessary. pgvector is still required for PGVectorStorage.
    image: pgvector/pgvector:pg17
    container_name: mmc-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lightrag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DATABASE:-rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lightrag} -d ${POSTGRES_DATABASE:-rag}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    container_name: mmc-lightrag
    restart: unless-stopped
    ports:
      # LOOPBACK ONLY, DELIBERATELY. This service holds a searchable index of
      # every decision, customer conversation, and internal disagreement in the
      # corpus. Publishing it on 0.0.0.0 puts that on the network unauthenticated.
      # To reach it from another machine, use an SSH tunnel:
      #   ssh -L 9621:127.0.0.1:9621 user@server
      - "127.0.0.1:9621:9621"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # These MUST match the image's own WORKING_DIR and INPUT_DIR. The image
      # sets /app/data/rag_storage and /app/data/inputs; mounting /app/rag_storage
      # and /app/inputs instead looks correct and silently does nothing, leaving
      # the index inside the container's writable layer where a rebuild destroys
      # it. Verified with `docker exec mmc-lightrag printenv` on 2026-08-14.
      - ./rag_storage:/app/data/rag_storage
      - ./minutes:/app/data/inputs:ro
    environment:
      # 0.0.0.0 binds inside the container only; the published port above is what
      # controls host exposure.
      - HOST=0.0.0.0
      - PORT=9621

      # Required. Set MMC_LIGHTRAG_API_KEY in .env - the pipeline sends it as
      # X-API-Key. Defence in depth behind the loopback bind.
      - LIGHTRAG_API_KEY=${MMC_LIGHTRAG_API_KEY:?set MMC_LIGHTRAG_API_KEY in .env}

      # ── Storage ──────────────────────────────────────────────────────
      # Postgres from day one, not the JSON/NanoVectorDB defaults. Those are
      # file-based and do not hold this corpus: ~5 meetings/day reaches thousands
      # of documents and 50-150k graph entities within a couple of years.
      # Migrating a populated graph later is painful, so this is configured before
      # any data exists.
      #
      # PGTableGraphStorage runs the graph on plain PostgreSQL 14+ tables - no
      # Apache AGE, no extensions - which is why the standard pgvector image works
      # instead of an AGE-bundled one.
      - LIGHTRAG_KV_STORAGE=PGKVStorage
      - LIGHTRAG_DOC_STATUS_STORAGE=PGDocStatusStorage
      - LIGHTRAG_VECTOR_STORAGE=PGVectorStorage
      - LIGHTRAG_GRAPH_STORAGE=PGTableGraphStorage

      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-lightrag}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-rag}
      - POSTGRES_MAX_CONNECTIONS=25
      # Retained for LightRAG's required storage schema. Vector ingestion is
      # disabled below and is not part of the active context path.
      - POSTGRES_VECTOR_INDEX_TYPE=HNSW

      # ── Model-backed routes are disabled ─────────────────────────────
      # LightRAG requires bindings in its startup schema, but this build never
      # calls document ingestion, vector search, or /query. Pointing both
      # bindings at a closed in-container port makes accidental use fail closed
      # instead of spending money or silently starting another model service.
      - LLM_BINDING=openai
      - LLM_BINDING_HOST=http://127.0.0.1:9/v1
      - LLM_MODEL=disabled-subscription-pipeline-authors-graph
      - EMBEDDING_BINDING=openai
      - EMBEDDING_BINDING_HOST=http://127.0.0.1:9/v1
      - EMBEDDING_MODEL=disabled-no-vector-ingestion
      - EMBEDDING_DIM=1024
      - OPENAI_API_KEY=disabled-no-model-calls

      - MAX_ASYNC=1
      - MAX_PARALLEL_INSERT=1

      - TIMEZONE=America/Toronto

volumes:
  postgres_data:
